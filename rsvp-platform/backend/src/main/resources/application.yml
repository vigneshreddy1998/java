server:
  port: ${PORT:8081}

spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/rsvp_platform}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
  gallery-url: ${GALLERY_URL:}
  jwt:
    secret: ${JWT_SECRET:change-this-dev-secret-change-this-dev-secret}
    # Admin sessions last a working day; guest sessions are short because the token lives
    # in memory only and is re-issued on each visit.
    admin-expiration-minutes: ${JWT_ADMIN_EXPIRATION_MINUTES:720}
    guest-expiration-minutes: ${JWT_GUEST_EXPIRATION_MINUTES:120}
  admin:
    bootstrap-username: ${ADMIN_BOOTSTRAP_USERNAME:admin}
    bootstrap-password: ${ADMIN_BOOTSTRAP_PASSWORD:changeme123}
  llm:
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${LLM_MODEL:claude-opus-5}
  phone:
    # Region assumed for numbers typed without a country code.
    default-region: ${PHONE_DEFAULT_REGION:US}
  rate-limit:
    max-attempts: ${RATE_LIMIT_MAX_ATTEMPTS:5}
    window-minutes: ${RATE_LIMIT_WINDOW_MINUTES:15}

logging:
  level:
    com.wedding.rsvpplatform: INFO
